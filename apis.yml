aid: aether-fuels
name: Aether Fuels
description: 'Aether Fuels is a sustainable-fuels technology company founded in April 2022
  by Conor Madigan with Xora Innovation, headquartered at Republic Plaza in Singapore with
  a U.S. R&D center on the GTI Energy campus in the Chicago area. Its Aether Aurora process
  is a radically simplified gas-to-liquid route that converts waste carbon — CO2, CO, methane
  and other hydrocarbons from gasified biomass, municipal solid waste, biogas and industrial
  off-gases — into drop-in sustainable liquid fuels for aviation and ocean shipping, combining
  an electrified thermochemical syngas reactor, three proprietary catalysts and by-product
  recycling to cut capital cost and raise carbon conversion efficiency at medium plant scale.
  The company runs a 1.5 gallon-per-day integrated pilot line with strategic partner GTI Energy,
  whose technology it licenses, and is building a 1+ barrel-per-day demonstration plant; it has
  signed MOUs with JetBlue and FlyORO and is partnered with Aster on a first commercial SAF
  plant in Singapore. Aether Fuels sells fuel and process technology, not software: it publishes
  no developer program, no public API, and no machine-readable API contract of any kind.'
